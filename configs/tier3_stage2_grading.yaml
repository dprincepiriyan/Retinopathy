# Tier 3: Stage-2 Fine-Grained DR Severity Grading (ICDR 0-4)
# This file is READ by src/training/stage2.py (notebook 02 and `python -m src.training.cli stage2`).
stage2_grading:
  num_classes: 5
  class_names: {0: "No DR", 1: "Mild NPDR", 2: "Moderate NPDR", 3: "Severe NPDR", 4: "Proliferative DR"}
  referable_grade_cutoff: 2

  data:
    manifest: "stage2_grading_splits.csv"
    augmentation: "medium"

  model:
    arch: "timm"                     # timm (recommended) | resvit_pro (from-scratch ablation)
    backbone_name: "efficientnet_b3"
    pretrained: true
    dropout: 0.3
    drop_path_rate: 0.2
    gem_p: 3.0
    # For arch: resvit_pro use instead: {fpn_dim: 64, num_heads: 4, gem_p: 3.0, dropout: 0.25}

  cv:
    folds: [1, 2, 3, 4]              # one model per validation fold -> true OOF predictions + 4-model ensemble

  imbalance:
    # Exactly ONE correction is applied:
    #   sampler      -> effective-number WeightedRandomSampler, unweighted CORAL loss
    #   loss_weights -> plain shuffling, per-threshold CORAL weights from class prevalence
    #   none         -> neither
    strategy: "sampler"
    effective_number_beta: 0.999

  loss:
    coral_focal_gamma: 1.0
    weights:
      ordinal: 1.0
      referable_bce: 0.5
      continuous_smooth_l1: 0.4
    # Soft-QWK weight is set per phase below (it is noisy on small batches).

  training:
    seed: 42
    weight_decay: 1.0e-2
    backbone_lr_mult: 0.2
    min_lr_ratio: 0.02
    grad_clip: 2.0
    ema_decay: 0.999
    num_workers: 2
    select_metric: "qwk"             # or qwk_continuous_default_thr / referable_auc

  curriculum:
    - name: "phase_a_512"
      resolution: 512
      epochs: 12
      batch_size: 16
      grad_accum_steps: 2            # effective batch 32
      lr: 3.0e-4
      warmup_epochs: 1
      soft_qwk_start: 0.0
      soft_qwk_end: 0.0
      train_gem_p: false
    - name: "phase_b_768"
      resolution: 768
      epochs: 8
      batch_size: 8
      grad_accum_steps: 4            # effective batch 32
      lr: 8.0e-5
      warmup_epochs: 0.5
      soft_qwk_start: 0.1
      soft_qwk_end: 0.3
      train_gem_p: true
