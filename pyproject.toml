[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "retinanet-pro"
version = "0.3.0"
description = "End-to-End Multi-Stage Deep Learning Framework for Automated Retinal Disease Screening and DR Severity Classification"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "RetinaNet-Pro Team"}
]
dependencies = [
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "scikit-learn>=1.3.0",
    "opencv-python-headless>=4.8.0",
    "Pillow>=10.0.0",
    "PyYAML>=6.0",
    "pydantic>=2.0.0",
    "torch>=2.0.0",
    "torchvision>=0.15.0",
    "timm>=0.9.8",
    "jinja2>=3.1.2",
    "streamlit>=1.28.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
]
full = [
    "lightgbm>=4.0.0",
    "weasyprint>=60.0",
    "imagehash>=4.3.1",
    "onnx>=1.14.0",
    "onnxruntime>=1.15.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-v"
